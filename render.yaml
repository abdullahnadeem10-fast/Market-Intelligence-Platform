# Render Blueprint: FastAPI backend (with in-process scheduler) + PostgreSQL.
# The React frontend is deployed separately on Vercel (see frontend/vercel.json).
services:
  - type: web
    name: mip-backend
    runtime: docker
    plan: free
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: mip-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: PORT
        value: "8000"
      - key: ENVIRONMENT
        value: production
      # Free web services have no separate worker, so the scheduler runs inside the API process.
      - key: SCHEDULER_ENABLED
        value: "true"
      - key: COLLECTION_INTERVAL_MINUTES
        value: "60"
      - key: ENABLED_COLLECTORS
        value: hackernews,gdelt,rss
      - key: COLLECTOR_DEMO_MODE
        value: "false"
      # The browser reaches the API through Vercel's /api rewrite (same origin), so CORS is rarely used.
      - key: CORS_ORIGINS
        value: http://localhost:5173
      - key: LLM_PROVIDER
        value: extractive
      # Set LLM_PROVIDER=openai and LLM_API_KEY in the Render dashboard to enable an LLM.
      - key: LLM_API_KEY
        sync: false

databases:
  - name: mip-db
    plan: free
    databaseName: mip
    user: mip
